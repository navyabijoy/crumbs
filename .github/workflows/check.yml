name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m py_compile scripts/render.py
      - name: Validate the example
        run: python scripts/render.py examples/example-trail.json --check-only
      - name: Build the example page
        run: python scripts/render.py examples/example-trail.json --out /tmp/crumbs-demo --no-open && grep -q '"plainTitle"' /tmp/crumbs-demo/index.html
